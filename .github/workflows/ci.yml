name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: azhl
          POSTGRES_PASSWORD: azhl_dev
          POSTGRES_DB: azhl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azhl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://azhl:azhl_dev@localhost:5432/azhl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Corepack installs the pnpm version pinned in package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages (PRs only)
        if: github.event_name == 'pull_request'
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Prisma generate
        run: pnpm --filter @azhl/database prisma:generate

      # Applies committed migrations only — never creates new ones (that's prisma:migrate, local dev).
      - name: Prisma migrate
        run: pnpm --filter @azhl/database prisma:deploy

      # Pages with `revalidate` are prerendered at build time and query Postgres, so the build
      # needs a seeded database (on Vercel: DATABASE_URL set for the Build environment).
      - name: Seed database
        run: pnpm db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
