services:
  postgres:
    image: postgres:16-alpine
    container_name: azhl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: azhl
      POSTGRES_PASSWORD: azhl_dev
      POSTGRES_DB: azhl
    ports:
      - "5432:5432"
    volumes:
      - azhl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azhl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  azhl_postgres_data:
